[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "bitwig-agent"
version = "0.2.0"
description = "Optional installer for the Bitwig Agent extension"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["bitwig", "mcp", "midi", "audio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]

[project.urls]
Homepage = "https://github.com/BANANASJIM/bitwig-agent"
Documentation = "https://github.com/BANANASJIM/bitwig-agent/blob/main/INSTALL.md"
Repository = "https://github.com/BANANASJIM/bitwig-agent"
Issues = "https://github.com/BANANASJIM/bitwig-agent/issues"
Releases = "https://github.com/BANANASJIM/bitwig-agent/releases"

[tool.hatch.build.targets.sdist]
# Downstream recipes contain the released sdist's checksum, not source inputs.
exclude = ["/packaging"]

[tool.hatch.build.targets.wheel]
# Keep legacy adapters and reference schemas in the checkout for development checks.
exclude = [
    "/src/bitwig_agent/catalog.py",
    "/src/bitwig_agent/cli.py",
    "/src/bitwig_agent/client.py",
    "/src/bitwig_agent/schema.py",
    "/src/bitwig_agent/server.py",
]

[project.scripts]
bitwig-agent-install = "bitwig_agent.install:main"

[dependency-groups]
dev = ["mcp>=2.3.0,<3", "pydantic>=2.12,<3", "pytest>=8.3,<9"]
native-music = ["numpy>=2,<3", "scipy>=1.15,<2", "soundfile>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

